<div class='layout'><app-sidebar></app-sidebar><main><h1>Citas médicas</h1><div class='card'><select [(ngModel)]='form.servicio_id'><option value=''>Seleccione servicio</option><option *ngFor='let s of servicios' [value]='s.servicio_id'>{{s.nombre}}</option></select><input type='date' [(ngModel)]='form.fecha'><input type='time' [(ngModel)]='form.hora'><button (click)='crear()'>Agendar</button></div><div class='list'><article *ngFor='let c of citas'><h3>{{c.fecha}} {{c.hora}}</h3><p>Servicio: {{c.servicio}}</p><p>Estado: {{c.estado}}</p><button (click)='cancelar(c.cita_id)' [disabled]="c.estado==='cancelada'">Cancelar</button></article></div></main></div>
