<div class='layout'><app-sidebar-admin></app-sidebar-admin><main><h1>Gestión de Pacientes</h1><table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Actividad</th><th>Acción</th></tr></thead><tbody><tr *ngFor='let u of usuarios'><td>{{u.usuario_id}}</td><td>{{u.nombre}}</td><td>{{u.email}}</td><td>{{u.rol}}</td><td>{{estado(u.ultima_actividad)}}</td><td><button (click)='eliminar(u.usuario_id)'>Eliminar</button></td></tr></tbody></table></main></div>
