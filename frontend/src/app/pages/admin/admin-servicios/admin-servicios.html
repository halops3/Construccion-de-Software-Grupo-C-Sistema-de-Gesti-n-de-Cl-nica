<div class='layout'><app-sidebar-admin></app-sidebar-admin><main><h1>Servicios Clínicos</h1><div class='form'><input [(ngModel)]='form.nombre' placeholder='Nombre'><input [(ngModel)]='form.descripcion' placeholder='Descripción'><input type='number' [(ngModel)]='form.duracion' placeholder='Duración'><input type='number' [(ngModel)]='form.precio' placeholder='Precio'><input type='file' (change)='seleccionarImagen($event)'><button (click)='crear()'>Crear servicio</button></div><div class='list'><article *ngFor='let s of servicios'><h3>{{s.nombre}}</h3><p>{{s.descripcion}}</p><p>Duración: {{s.duracion}} min</p><button (click)='eliminar(s.servicio_id)'>Eliminar</button></article></div></main></div>
